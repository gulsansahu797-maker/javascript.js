<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
    <style>
        width: 100%;
        table {
            border-collapse:collapse;
            text-align:center;
            color:aliceblue;
        }
        th, td {
            padding: 10px;
            border: 10px solid #ddd;

        }
        tr {

        }
    </style>
</head>
<body>
    <h1>Table</h1>
    <h2>Description</h2>
    <!-- <p> A table is a structured arrangement of data organized into rows and
        columns. it is used to present information in a tabular format, making
        it easier to read, compare,and analyze data. tables are
        commonly used in various contexts, such as databases, spreadsheets.
    </p> // tr = table row, th = table header, td = table 
    -->
    <table border="1">
        <tr>
            <th>name</th>
            <th>age</th>
            <th>city</th>
        </tr>
        <tr>
            <td>gulsan kumar</td>
            <td>20</td>
            <td>singrauli</td>
        </tr>
        <tr>
            <td>vinod kumar</td>
            <td>19</td>
            <td>bhopal</td>
        </tr>
        <tr>
            <td>gautam shah</td>
            <td>21</td>
            <td>jabalpur</td>
        </tr>
        <tr>
            <td>rahul singh</td>
            <td>23</td>
            <td>delhi</td>
        </tr>
    </table>
</body>
</html>
